<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex,nofollow">

  <meta name="description" content="逐校查看 2027 年日本大学申请材料清单。">

<body>
  <header><div class="wrap">
    <div class="eyebrow">家庭只读版</div>
    <h1>2027 申请材料清单</h1>
    <p>按大学查看要交的材料、适用条件和申请节点。</p>
  </div></header>
  <main class="wrap">
    <div id="status" class="notice" role="status">正在打开清单…</div>
    <div id="content" hidden>
      <div class="notice" role="note"><strong>使用说明</strong><span>这是截至 2026 年 9 月 27 日从私人工作台整理的只读快照。交材料前仍须查看校方当年度要项；这个页面不显示文件原件和勾选进度。</span></div>
      <label class="search-label" for="search">查找材料</label>
      <input id="search" type="search" placeholder="例如：毕业证明、EJU、CHSI" autocomplete="off">
      <p class="count" id="count"></p>
      <div id="groups"></div>
    </div>
  </main>
  <footer><div class="wrap">从私人申请季工作台整理 · 请只将完整链接转给需要查看的家人</div></footer>
</body>
